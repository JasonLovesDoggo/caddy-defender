name: Update IP Ranges
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly at midnight on Sunday
  workflow_dispatch: # Allow manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create CIDR updater token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CIDR_UPDATER_APP_ID }}
          private-key: ${{ secrets.CIDR_UPDATER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run CLI to generate Go file
        run: |
          go run ranges/main.go -format go -output ranges/data/generated.go

      - name: Commit files
        id: commit
        run: |
          git add ranges/data/generated.go
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: Update AI's CIDR"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa # master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: main
